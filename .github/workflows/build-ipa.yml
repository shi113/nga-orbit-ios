name: Build NGA Orbit IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcodebuild -version

      - name: Build iOS app
        run: |
          xcodebuild \
            -project NGAReader.xcodeproj \
            -scheme NGAReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/NGAReader.app \
            package/Payload/
          cd package
          zip -r ../NGAOrbit-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NGAOrbit-unsigned-IPA
          path: NGAOrbit-unsigned.ipa
          retention-days: 7
